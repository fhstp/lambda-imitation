# Bayesian sweep over PocMan, maximising the smoothed final return.
#
#   wandb sweep examples/lambda-envs/sweeps/pocman_bayes.yaml
#   CUDA_VISIBLE_DEVICES=0 wandb agent <entity>/<project>/<sweep-id>
#
# Run it from the repo root (`program:` is a repo-relative path).  Every
# batch_size is the sequences-per-gradient-step knob: it absorbed the old
# online_batch_size (the live one), while the old batch_size only sized an
# expert buffer that nothing sampled.  Every parameter below is a real flag
# that reaches Hyperparameters; that is pinned by
# tests/test_sweep_params.py, because a sweep naming a parameter the script does
# not expose is silently ignored and still looks healthy.
#
# NOTE: with --probe-eval-interval=0 the probe phases produce nothing the sweep
# reads, but the script still runs them after training, at their defaults
# (--collect-steps 100000, --probe-steps 500000).  Adding --train-only to the
# command block below skips them; final/return_smoothed is logged before that
# exit, so the sweep metric is unaffected.
command:
- ${env}
- python
- ${program}
- --wandb
- --num-seeds=3
- --rounds=12
- --probe-eval-interval=0
- --final-return-window=3
- --seed=0
- --retrace
- --no-use-sac
- --paper-arch
- --memory-type gru
- --memory-hidden-dim 512
- --stop-actor-fe
- --gamma 0.95
- --tau 0.005
- --train-steps 10000
- ${args_no_boolean_flags}
method: bayes
metric:
  goal: maximize
  name: final/return_smoothed/mean
parameters:
  alpha:
    distribution: uniform
    max: 1
    min: 0.1
  batch_size:
    distribution: int_uniform
    max: 256
    min: 64
  burn_in_length:
    distribution: int_uniform
    max: 15
    min: 5
  lambda1:
    distribution: uniform
    max: 0.4
    min: 0.05
  lambda_coef:
    distribution: uniform
    max: 1
    min: 0.005
  online_buffer_size:
    distribution: int_uniform
    max: 200000
    min: 100000
  sequence_length:
    distribution: int_uniform
    max: 80
    min: 20
program: examples/lambda-envs/pocman_pellet_probe.py
