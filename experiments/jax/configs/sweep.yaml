program: partial_gridworld_sweep.py
name: jax-sac-partial-gridworld-sweep
project: jax-sac-partial-gridworld-sweep
method: random
metric:
  goal: maximize
  name: eval/return
parameters:
  q_lr:
    distribution: log_uniform_values
    min: 0.00005
    max: 0.0003
  policy_lr:
    distribution: log_uniform_values
    min: 0.00005
    max: 0.0003
  tau:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.05
  lambda_discrepancy_coef:
    distribution: uniform
    min: 0.0
    max: 1.0
